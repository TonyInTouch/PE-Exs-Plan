.toggle-btn { display: block; margin: 0.5rem auto 0.75rem; background: none; border: 1px solid #2c4040; border-radius: 20px; color: #4a7a72; font-size: 0.62rem; font-family: system-ui; padding: 0.2rem 0.8rem; cursor: pointer; letter-spacing: 0.05em; }
.ev-box-bottom { background: #f0f4f2; border: 1px solid #c8dcd6; border-radius: 6px; padding: 0.6rem 0.9rem; margin-top: 1.5rem; font-size: 0.7rem; color: #3a5a52; line-height: 1.55; font-family: system-ui; }

.overview { background: #243635; color: #c8dcd6; padding: 0.9rem 1.25rem; }
.ov-title { font-size: 0.68rem; font-weight: 600; color: #7FBEAB; letter-spacing: 0.1em; text-transform: uppercase; font-family: system-ui; margin-bottom: 0.6rem; }
.ov-rows { display: flex; flex-wrap: wrap; gap: 0.35rem 1.2rem; }
.ov-row { display: flex; gap: 0.45rem; align-items: center; }
.ov-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ov-txt { font-size: 0.71rem; line-height: 1.4; font-family: system-ui; }
.ov-note { margin-top: 0.6rem; font-size: 0.65rem; color: #6a8a87; font-family: system-ui; line-height: 1.5; border-top: 1px solid #2c4040; padding-top: 0.6rem; }

#top-panel { overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s ease; max-height: 200px; opacity: 1; }

.stats-bar { display: flex; justify-content: center; gap: 2rem; padding: 1rem 1.25rem 0.25rem; flex-wrap: wrap; }
.stat-val { font-size: 1.4rem; color: #7FBEAB; font-weight: 600; }
.stat-lbl { font-size: 0.6rem; color: #7a9a97; text-transform: uppercase; letter-spacing: 0.1em; font-family: system-ui; }

.tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; background: transparent; color: #7a9a97; border: none; padding: 0.65rem 0.85rem; cursor: pointer; font-size: 0.72rem; font-family: Georgia, serif; border-radius: 6px 6px 0 0; white-space: nowrap; text-align: center; }
.tab.active { font-weight: 700; color: #1c2b2a; }
.tab-sub { font-size: 0.58rem; margin-top: 0.1rem; }

.content { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

.phase-header { border-left: 4px solid var(--pc); padding-left: 1rem; margin-bottom: 1.1rem; }
.phase-title { font-size: 1.2rem; font-weight: 400; margin-bottom: 0.15rem; }
.phase-wk { font-size: 0.78rem; color: #888; margin-bottom: 0.6rem; font-family: system-ui; }
.phase-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
.badge { background: #f0ece4; border: 1px solid var(--pc); border-radius: 4px; padding: 0.3rem 0.6rem; font-size: 0.68rem; color: var(--pa); font-family: system-ui; }
.phase-focus { font-size: 0.83rem; line-height: 1.65; color: #3a3a3a; }

.tracker { background: #fff; border: 1px solid #e0dcd4; border-radius: 10px; padding: 1rem 1rem 0.75rem; margin-bottom: 1.25rem; }
.tr-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
.tr-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: #888; font-family: system-ui; font-weight: 600; }

.prog-bar { height: 6px; background: #f0ece4; border-radius: 3px; margin-bottom: 1rem; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; background: var(--pc); }
.week-rows { display: flex; flex-direction: column; gap: 0.55rem; }
.week-row { display: flex; align-items: center; gap: 0.75rem; }
.week-lbl { font-size: 0.68rem; color: #888; font-family: system-ui; width: 3.8rem; flex-shrink: 0; }
.boxes { display: flex; gap: 0.45rem; }
.sbox { width: 40px; height: 40px; border-radius: 8px; border: 2px solid #ddd; background: #faf9f7; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0; user-select: none; }
.sbox.done { background: var(--pc); border-color: var(--pc); font-size: 1.1rem; color: #fff; }
.tr-footer { margin-top: 0.8rem; padding-top: 0.65rem; border-top: 1px solid #f0ece4; display: flex; justify-content: flex-end; }
.reset-btn { background: none; border: 1px solid #e0dcd4; border-radius: 5px; padding: 0.28rem 0.65rem; font-size: 0.63rem; color: #bbb; cursor: pointer; font-family: system-ui; }

.ex-list { display: flex; flex-direction: column; gap: 0.65rem; }
.ex { border: 1px solid #e0dcd4; border-radius: 8px; overflow: hidden; background: #fff; }
.ex.open { border-color: var(--pc); background: #fffefb; }
.ex-btn { width: 100%; background: none; border: none; padding: 0.9rem 1rem; cursor: pointer; text-align: left; font-family: inherit; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.ex-name { font-size: 0.88rem; font-weight: 600; color: #1a1a1a; }
.type-badge { font-size: 0.58rem; padding: 0.15rem 0.4rem; border-radius: 3px; letter-spacing: 0.08em; text-transform: uppercase; font-family: system-ui; }
.ex-meta { display: flex; gap: 0.9rem; margin-top: 0.3rem; font-size: 0.7rem; color: #888; font-family: system-ui; flex-wrap: wrap; }
.ex-meta strong { color: #555; }
.arrow { font-size: 1rem; color: var(--pc); flex-shrink: 0; line-height: 1; }
.ex.open .arrow { transform: rotate(180deg); }
.ex-body { padding: 0 1rem 1rem; display: none; border-top: 1px solid #eee; }
.ex.open .ex-body { display: block; }
.cue-box { background: #f8f6f2; border-radius: 6px; padding: 0.85rem; margin: 0.6rem 0; }
.cue-lbl { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: #999; margin-bottom: 0.3rem; font-family: system-ui; }
.cue-txt { font-size: 0.81rem; line-height: 1.65; color: #2a2a2a; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
.di { background: #f0f4f2; border-radius: 5px; padding: 0.55rem 0.65rem; }
.di.full { grid-column: 1 / -1; }
.di-lbl { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: #888; font-family: system-ui; margin-bottom: 0.15rem; }
.di-val { font-size: 0.74rem; color: #3a3a3a; line-height: 1.5; font-family: system-ui; }
.yt-link { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.65rem; background: #1c2b2a; color: #7FBEAB; border-radius: 6px; padding: 0.45rem 0.85rem; font-size: 0.72rem; font-family: system-ui; text-decoration: none; }

.principles { margin-top: 1.75rem; }
.principles h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #888; margin-bottom: 0.9rem; font-family: system-ui; }
.principle { background: #fff; border: 1px solid #e8e4dc; border-radius: 7px; padding: 0.85rem 1rem; display: flex; gap: 0.75rem; margin-bottom: 0.6rem; }
.pr-icon { font-size: 1.2rem; flex-shrink: 0; }
.pr-title { font-size: 0.8rem; font-weight: 700; margin-bottom: 0.2rem; }
.pr-body { font-size: 0.75rem; color: #555; line-height: 1.6; font-family: system-ui; }

<div class="overview" id="overview"></div>

  functional:    { bg:"#fdf0e0", color:"#8a5a20", label:"Functional" }
};

  { icon:"📅", title:"Frequency", body:"3 sessions per week — the exact frequency used across all Pastore et al. trials (2014, 2018, 2022). Daily training is not better evidenced and risks fatigue." },

var activePhase = 0;
var openEx = null;
var sessions = PHASES.map(function(p) {
  return Array.from({length: p.numWeeks}, function() { return [false, false, false]; });
});

function tryLoad() {
  try { var r = localStorage.getItem('pe_v3'); if (r) sessions = JSON.parse(r); } catch(e) {}
}
function trySave() {
  try { localStorage.setItem('pe_v3', JSON.stringify(sessions)); } catch(e) {}
}
tryLoad();

function togglePanel() {
  var panel = document.getElementById('top-panel');
  var btn = document.getElementById('toggle-btn');
  var collapsed = panel.classList.toggle('collapsed');
  btn.innerHTML = collapsed ? '&#9660; more' : '&#9650; less';
}

function setCSS(p) {
  document.documentElement.style.setProperty('--pc', p.color);
  document.documentElement.style.setProperty('--pa', p.accent);
  document.documentElement.style.setProperty('--ps', p.shadow);
}

function switchPhase(i) {
  activePhase = i;
  openEx = null;
  setCSS(PHASES[i]);
  renderTabs();
  renderContent();
  window.scrollTo(0, 0);
}

function toggleEx(id) {
  openEx = (openEx === id) ? null : id;
  renderContent();
}

function toggleSession(pi, wi, si) {
  sessions[pi][wi][si] = !sessions[pi][wi][si];
  trySave();
  renderTracker();
}

function resetPhase(pi) {
  sessions[pi] = Array.from({length: PHASES[pi].numWeeks}, function() { return [false,false,false]; });
  trySave();
  renderTracker();
}

function renderOverview() {
  var el = document.getElementById('overview');
  var rows = PHASES.map(function(ph) {
    return '<div class="ov-row"><div class="ov-dot" style="background:' + ph.color + '"></div>'
      + '<div class="ov-txt"><span style="color:' + ph.color + ';font-weight:600">' + ph.weeks + '</span> — ' + ph.title + '</div></div>';
  }).join('');
  el.innerHTML = '<div class="ov-title">Programme Overview</div>'
    + '<div class="ov-rows">' + rows + '</div>'
    + '<div class="ov-note">Hold times progress 5→7→10→12 sec &middot; Volume increases gradually &middot; Diaphragmatic breathing practised daily including rest days</div>';
}

function renderTabs() {
  var html = '';
  for (var i = 0; i < PHASES.length; i++) {
    var ph = PHASES[i];
    var cls = i === activePhase ? 'tab active' : 'tab';
    var style = i === activePhase ? 'style="background:' + ph.color + '"' : '';
    html += '<button class="' + cls + '" ' + style + ' onclick="switchPhase(' + i + ')">'
      + ph.label + '<div class="tab-sub">' + ph.weeks + '</div></button>';
  }
  document.getElementById('tabs').innerHTML = html;
}

function renderTracker() {
  var el = document.getElementById('tracker');
  if (!el) return;
  var pi = activePhase;
  var p = PHASES[pi];
  var offset = 0;
  for (var x = 0; x < pi; x++) offset += PHASES[x].numWeeks;
  var total = p.numWeeks * 3;
  var done = 0;
  for (var w = 0; w < sessions[pi].length; w++) {
    for (var s = 0; s < sessions[pi][w].length; s++) {
      if (sessions[pi][w][s]) done++;
    }
  }
  var pct = total ? Math.round(done / total * 100) : 0;
  var html = '<div class="tr-top"><span class="tr-label">Session Tracker</span>'
    + '<span class="tr-count">' + done + ' / ' + total + ' complete</span></div>'
    + '<div class="prog-bar"><div class="prog-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="week-rows">';
  for (var wi = 0; wi < p.numWeeks; wi++) {
    html += '<div class="week-row"><div class="week-lbl">Week ' + (offset + wi + 1) + '</div><div class="boxes">';
    for (var si = 0; si < 3; si++) {
      var checked = sessions[pi][wi][si];
      html += '<div class="sbox' + (checked ? ' done' : '') + '" onclick="toggleSession(' + pi + ',' + wi + ',' + si + ')">' + (checked ? '✓' : '') + '</div>';
    }
    html += '</div></div>';
  }
  html += '</div><div class="tr-footer"><button class="reset-btn" onclick="resetPhase(' + pi + ')">Reset phase</button></div>';
  el.innerHTML = html;
}

function renderContent() {
  var p = PHASES[activePhase];
  var html = '';
  html += '<div class="phase-header">'
    + '<div class="phase-title">' + p.title + '</div>'
    + '<div class="phase-wk">' + p.weeks + '</div>'
    + '<div class="phase-meta"><span class="badge">📆 ' + p.freq + '</span><span class="badge">⏱ ' + p.sess + '</span></div>'
    + '<div class="phase-focus">' + p.focus + '</div>'
    + '</div>';
  html += '<div class="tracker" id="tracker"></div>';
  html += '<div class="ex-list">';
  for (var i = 0; i < p.exercises.length; i++) {
    var ex = p.exercises[i];
    var eid = activePhase + '-' + i;
    var isOpen = openEx === eid;
    var ts = TYPE_STYLE[ex.type];
    html += '<div class="ex' + (isOpen ? ' open' : '') + '">';
    html += '<button class="ex-btn" onclick="toggleEx(\'' + eid + '\')">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">'
      + '<span class="ex-name">' + ex.name + '</span>'
      + '<span class="type-badge" style="background:' + ts.bg + ';color:' + ts.color + '">' + ts.label + '</span>'
      + '</div>'
      + '<div class="ex-meta"><span><strong>Sets:</strong> ' + ex.sets + '</span><span><strong>Reps:</strong> ' + ex.reps + '</span><span><strong>Hold:</strong> ' + ex.hold + '</span></div>'
      + '</div>'
      + '<span class="arrow">&#9662;</span>'
      + '</button>';
    html += '<div class="ex-body">'
      + '<div class="cue-box"><div class="cue-lbl">Technique cue</div><div class="cue-txt">' + ex.cue + '</div></div>'
      + '<div class="detail-grid">'
      + '<div class="di"><div class="di-lbl">Rest</div><div class="di-val">' + ex.rest + '</div></div>'
      + '<div class="di"><div class="di-lbl">Type</div><div class="di-val">' + ts.label + '</div></div>'
      + '<div class="di full"><div class="di-lbl">Evidence note</div><div class="di-val">' + ex.ev + '</div></div>'
      + '</div>'
      + (ex.url ? '<a class="yt-link" href="' + ex.url + '" target="_blank">&#9654; Watch on YouTube</a>' : '')
      + '</div>';
    html += '</div>';
  }
  html += '</div>';
  if (activePhase === 3) {
    html += '<div class="principles"><h3>Key Principles</h3>';
    for (var j = 0; j < PRINCIPLES.length; j++) {
      var pr = PRINCIPLES[j];
      html += '<div class="principle"><div class="pr-icon">' + pr.icon + '</div>'
        + '<div><div class="pr-title">' + pr.title + '</div><div class="pr-body">' + pr.body + '</div></div></div>';
    }
    html += '</div>';
  }
  html += '<div class="ev-box-bottom"><strong>Evidence base:</strong> ' + p.evidence + '</div>';
  document.getElementById('content').innerHTML = html;
  renderTracker();
}

setCSS(PHASES[0]);
renderOverview();
renderTabs();
renderContent();
</script>
</body>
</html>
